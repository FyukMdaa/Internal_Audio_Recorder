# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.x ships "built-in Kotlin". This project instead manages Kotlin explicitly
# with the Kotlin Android plugin (org.jetbrains.kotlin.android, 2.4.21) so that the
# Kotlin / Compose compiler versions stay under our control. The two flags below are
# the official temporary opt-out supported by AGP 9 (removed in AGP 10).
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
