name: Release APK

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Ensure Android SDK components (platform 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "platform-tools" || true

      - name: Restore signing keystore from secrets
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret is not set - building an UNSIGNED release APK."
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          CI_KEYSTORE_PATH: /tmp/release.keystore
          CI_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Build unsigned release APK
        if: steps.keystore.outputs.signed == 'false'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Move APK to a stable path
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
