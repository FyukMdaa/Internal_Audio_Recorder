name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project layout
        run: |
          echo "--- checkout root ---"
          ls -la
          echo "--- app/ ---"
          ls -la app 2>/dev/null || true
          fail=0
          for f in settings.gradle.kts build.gradle.kts gradle/libs.versions.toml \
                   gradle/wrapper/gradle-wrapper.jar app/build.gradle.kts \
                   app/src/main/AndroidManifest.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file missing from repository: $f"
              fail=1
            fi
          done
          if [ -f InternalAudioRecorder/settings.gradle.kts ]; then
            echo "::error::Project files are under the InternalAudioRecorder/ subfolder. Push the CONTENTS of that folder to the repository root instead."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "See README 'Repository layout' section. Re-push the full project so that app/build.gradle.kts sits at <repo-root>/app/build.gradle.kts."
            exit 1
          fi
          echo "Project layout OK."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Ensure Android SDK components (platform 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "platform-tools" || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
